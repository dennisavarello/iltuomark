<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Gli imprenditori che lavorano con Mark raccontano com'è andata, per intero.">
<meta name="theme-color" content="#050505">
<meta property="og:title" content="Mark · Parlano loro">
<meta property="og:description" content="Gli imprenditori che lavorano con Mark raccontano com'è andata.">
<meta property="og:image" content="https://iltuomark.com/testimonianze/giacomo-1.jpg">
<meta property="og:url" content="https://iltuomark.com/testimonianze/">

<!--
  TESTIMONIANZE · v1 (28 ott 2026). Dennis: «una pagina testimonianze sul dominio di Mark, dove le carichiamo tutte».
  Per aggiungerne una: una riga in cima a TESTIMONIANZE (la più nuova va prima) + il poster in questa cartella.
  yt = codice del video YouTube «non in elenco» (quello dopo v= nel link). mp4 = file già online. Senza nessuno dei due la card non compare.
  Metodo: cervello-claude/Testimonianze Video — Il Metodo per Pubblicarle su iltuomark.com (Ott 2026).md
-->
<style>
@font-face{font-family:Stark;src:url(/michroma-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Switzer;src:url(/switzer-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Switzer;src:url(/switzer-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(/geist-mono-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Instrument Serif';src:url(/instrument-serif-400-corsivo.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
:root{
  --ossidiana:#050505;--grafite:#0F0F10;--linea:#1F1F21;--avorio:#F2F0EB;--titanio:#8C8C8C;--ambra:#E39B3A;--ambra-forte:#F2B25E;
  --stark:Stark,Switzer,sans-serif;--testo:Switzer,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;--corsivo:'Instrument Serif',Georgia,serif;
  --curva:cubic-bezier(.32,.72,0,1);color-scheme:dark
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ossidiana);color:var(--avorio);font:500 17px/1.5 var(--testo);overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--stark);font-weight:400;margin:0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
p{margin:0;text-wrap:pretty}
:focus-visible{outline:2px solid var(--ambra);outline-offset:4px}
.corsivo{font-family:var(--corsivo);font-style:italic;text-transform:none;letter-spacing:0;color:var(--ambra);font-size:1.3em;line-height:.8}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--titanio)}

.testa{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px max(16px,4vw);background:linear-gradient(var(--ossidiana) 60%,transparent)}
.marchio{font-family:var(--stark);font-size:15px;letter-spacing:.32em;display:flex;align-items:center;gap:10px}
.marchio i{width:6px;height:6px;border-radius:50%;background:var(--ambra);box-shadow:0 0 10px var(--ambra)}

.eroe{padding:12vh max(16px,4vw) 9vh;max-width:1240px;margin:0 auto}
.eroe h1{font-size:clamp(40px,8.4vw,112px);line-height:1}
.eroe p{margin-top:28px;font-size:clamp(18px,1.6vw,22px);color:var(--titanio);max-width:30ch}

.elenco{max-width:1240px;margin:0 auto;padding:0 max(16px,4vw);display:grid;gap:72px 32px;grid-template-columns:1fr}
@media (min-width:900px){.elenco{grid-template-columns:1fr 1fr}.elenco .prima{grid-column:1/-1}}
.voce{opacity:0;transform:translateY(24px);transition:opacity .9s var(--curva),transform .9s var(--curva)}
.voce.vista{opacity:1;transform:none}
.schermo{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--grafite);border:1px solid var(--linea);cursor:pointer}
.schermo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) brightness(.82);transition:transform 1.2s var(--curva),filter .6s}
.schermo:hover img{transform:scale(1.025);filter:saturate(1) brightness(.92)}
.schermo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(5,5,5,.75))}
.play{position:absolute;z-index:2;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:1px solid rgba(242,178,94,.55);background:rgba(5,5,5,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .5s var(--curva),background .4s}
.play::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(227,155,58,.25);animation:onda 2.6s ease-out infinite}
@keyframes onda{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.play svg{width:24px;height:24px;margin-left:4px;fill:var(--ambra-forte)}
.schermo:hover .play{transform:scale(1.08);background:rgba(227,155,58,.18)}
.durata{position:absolute;z-index:2;right:16px;bottom:14px;color:var(--avorio)}
.schermo iframe,.schermo video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.schermo.acceso{cursor:auto}
.schermo.acceso::after{display:none}
.chi{margin-top:22px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
.chi h2{font-size:clamp(20px,2.2vw,30px);line-height:1.15}
.prima .chi h2{font-size:clamp(24px,3.2vw,44px)}
.chi p{width:100%;color:var(--titanio);font-size:17px}

.chiusura{padding:18vh max(16px,4vw) 14vh;text-align:center}
.chiusura h2{font-size:clamp(30px,5.4vw,72px);line-height:1.05}
.pulsante{display:inline-block;margin-top:40px;padding:18px 34px;border-radius:999px;background:var(--ambra);color:#140C02;font:600 17px/1 var(--testo);box-shadow:0 0 40px rgba(227,155,58,.25);transition:transform .4s var(--curva),box-shadow .4s}
.pulsante:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(227,155,58,.4)}
.piede{padding:28px max(16px,4vw) 40px;border-top:1px solid var(--linea);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.piede a:hover{color:var(--avorio)}
@media (prefers-reduced-motion:reduce){.voce{opacity:1;transform:none;transition:none}.play::before{animation:none}}
</style>
</head>
<body>

<header class="testa">
  <a class="marchio" href="/"><i></i>MARK</a>
  <span class="mono">Testimonianze</span>
</header>

<section class="eroe">
  <h1>Parlano <span class="corsivo">loro.</span></h1>
  <p>Imprenditori che lavorano con Mark ogni giorno raccontano com'è andata.</p>
</section>

<main class="elenco js-elenco"></main>

<section class="chiusura">
  <h2>La prossima<br>è la <span class="corsivo">tua.</span></h2>
  <a class="pulsante" href="/">Voglio il mio Mark</a>
</section>

<footer class="piede mono">
  <span>Mark I · Dennis Avarello Consulting</span>
  <a href="/privacy.html">Privacy</a>
</footer>

<script>
/* La più nuova va in cima. Una riga = una testimonianza. */
const TESTIMONIANZE = [
  { nome: 'Giacomo Torreggiani', ruolo: 'Profilsystem · profilati in acciaio su misura', durata: '28 min',
    poster: 'giacomo-1.jpg', yt: '', mp4: '' },
  { nome: 'Stefano Coggi', ruolo: 'Personal trainer', durata: '8 min',
    poster: 'stefano-1.jpg', yt: '', mp4: 'https://iltuojarvis.com/v/1a22e1368b/testimonianza-stefano.mp4' },
];

const elenco = document.querySelector('.js-elenco');
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>';

TESTIMONIANZE.filter(t => t.yt || t.mp4).forEach((t, i) => {
  const voce = document.createElement('article');
  voce.className = 'voce' + (i === 0 ? ' prima' : '');
  voce.innerHTML = `
    <div class="schermo" role="button" tabindex="0" aria-label="Guarda la testimonianza di ${t.nome}">
      <img src="${t.poster}" alt="${t.nome}" loading="${i < 2 ? 'eager' : 'lazy'}">
      <span class="play">${PLAY}</span>
      <span class="durata mono">${t.durata}</span>
    </div>
    <div class="chi">
      <h2>${t.nome}</h2>
      <p>${t.ruolo}</p>
    </div>`;
  const schermo = voce.querySelector('.schermo');
  const accendi = () => {
    if (schermo.classList.contains('acceso')) return;
    spegniTutti();
    schermo.classList.add('acceso');
    schermo.dataset.poster = schermo.innerHTML;
    schermo.innerHTML = t.yt
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${t.yt}?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${t.nome}"></iframe>`
      : `<video src="${t.mp4}" controls autoplay playsinline preload="auto"></video>`;
  };
  schermo.addEventListener('click', accendi);
  schermo.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); accendi(); } });
  elenco.appendChild(voce);
});

/* Un video alla volta: aprirne uno chiude l'altro. */
function spegniTutti() {
  document.querySelectorAll('.schermo.acceso').forEach(s => {
    s.innerHTML = s.dataset.poster; s.classList.remove('acceso');
  });
}

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vista'); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll('.voce').forEach(v => io.observe(v));
</script>
<script src="/pixel.js" defer></script>
</body>
</html>
